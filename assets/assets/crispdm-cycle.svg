<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">CRISP-DM Cycle (Iterative)</title>
  <desc id="d">
    A circular diagram showing the six CRISP-DM phases: Business Understanding, Data Understanding,
    Data Preparation, Modeling, Evaluation, and Deployment, arranged in a loop to indicate iteration.
  </desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { fill: #0b3b7a; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .muted { fill: #254c86; opacity: 0.85; }
      .card { fill: #ffffff; stroke: #0b3b7a; stroke-width: 3; }
      .soft { fill: #f4f8ff; stroke: #0b3b7a; stroke-width: 3; }
      .phaseTitle { font-size: 18px; font-weight: 800; }
      .phaseText { font-size: 13.5px; font-weight: 500; }
      .centerTitle { font-size: 22px; font-weight: 900; }
      .centerText { font-size: 14px; font-weight: 600; }
      .arrow { stroke: #0b3b7a; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .shadow { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.10)); }
    </style>

    <!-- arrow head marker -->
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#0b3b7a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="900" height="520" rx="18"/>

  <!-- Heading -->
  <text class="ink" x="450" y="48" text-anchor="middle" font-size="20" font-weight="900">
    CRISP-DM: 6 Phases in an Iterative Cycle
  </text>
  <text class="muted" x="450" y="74" text-anchor="middle" font-size="14" font-weight="600">
    Data flows forward, but teams often loop back based on what they learn.
  </text>

  <!-- Center card -->
  <g class="shadow">
    <rect class="soft" x="320" y="190" width="260" height="150" rx="16"/>
  </g>
  <text class="ink centerTitle" x="450" y="232" text-anchor="middle">CRISP-DM</text>
  <text class="ink centerText" x="450" y="260" text-anchor="middle">Plan → Build → Evaluate → Apply</text>
  <text class="muted" x="450" y="288" text-anchor="middle" font-size="12.5" font-weight="600">
    Iterative: results can send you back to earlier steps.
  </text>

  <!-- Phase boxes (6) -->
  <!-- 1 Business Understanding (top) -->
  <g class="shadow">
    <rect class="card" x="315" y="105" width="270" height="70" rx="14"/>
  </g>
  <text class="ink phaseTitle" x="450" y="135" text-anchor="middle">1) Business Understanding</text>
  <text class="muted phaseText" x="450" y="158" text-anchor="middle">Goal, success criteria, constraints</text>

  <!-- 2 Data Understanding (top-right) -->
  <g class="shadow">
    <rect class="card" x="610" y="160" width="260" height="70" rx="14"/>
  </g>
  <text class="ink phaseTitle" x="740" y="190" text-anchor="middle">2) Data Understanding</text>
  <text class="muted phaseText" x="740" y="213" text-anchor="middle">Collect, explore, quality checks</text>

  <!-- 3 Data Preparation (bottom-right) -->
  <g class="shadow">
    <rect class="card" x="610" y="295" width="260" height="70" rx="14"/>
  </g>
  <text class="ink phaseTitle" x="740" y="325" text-anchor="middle">3) Data Preparation</text>
  <text class="muted phaseText" x="740" y="348" text-anchor="middle">Clean, transform, feature engineer</text>

  <!-- 4 Modeling (bottom) -->
  <g class="shadow">
    <rect class="card" x="315" y="350" width="270" height="70" rx="14"/>
  </g>
  <text class="ink phaseTitle" x="450" y="380" text-anchor="middle">4) Modeling</text>
  <text class="muted phaseText" x="450" y="403" text-anchor="middle">Train, tune, validate models</text>

  <!-- 5 Evaluation (bottom-left) -->
  <g class="shadow">
    <rect class="card" x="30" y="295" width="260" height="70" rx="14"/>
  </g>
  <text class="ink phaseTitle" x="160" y="325" text-anchor="middle">5) Evaluation</text>
  <text class="muted phaseText" x="160" y="348" text-anchor="middle">Metrics, fit-for-purpose check</text>

  <!-- 6 Deployment (top-left) -->
  <g class="shadow">
    <rect class="card" x="30" y="160" width="260" height="70" rx="14"/>
  </g>
  <text class="ink phaseTitle" x="160" y="190" text-anchor="middle">6) Deployment</text>
  <text class="muted phaseText" x="160" y="213" text-anchor="middle">Apply results, monitor, iterate</text>

  <!-- Loop arrows (clockwise) -->
  <!-- BU -> DU -->
  <path class="arrow" marker-end="url(#arrowHead)" d="M585,138 C640,140 645,160 655,175" />
  <!-- DU -> DP -->
  <path class="arrow" marker-end="url(#arrowHead)" d="M740,230 C760,255 760,285 740,295" />
  <!-- DP -> Modeling -->
  <path class="arrow" marker-end="url(#arrowHead)" d="M610,330 C565,350 540,360 520,368" />
  <!-- Modeling -> Evaluation -->
  <path class="arrow" marker-end="url(#arrowHead)" d="M315,385 C260,385 230,375 210,365" />
  <!-- Evaluation -> Deployment -->
  <path class="arrow" marker-end="url(#arrowHead)" d="M160,295 C140,270 140,245 160,230" />
  <!-- Deployment -> BU -->
  <path class="arrow" marker-end="url(#arrowHead)" d="M290,175 C320,155 340,145 365,140" />

  <!-- Iteration callout -->
  <g>
    <rect x="295" y="455" width="310" height="44" rx="12" fill="#f4f8ff" stroke="#0b3b7a" stroke-width="2.5"/>
    <text class="ink" x="450" y="483" text-anchor="middle" font-size="13.5" font-weight="700">
      Example loop: If Evaluation shows issues → return to Data Preparation → retrain → re-evaluate.
    </text>
  </g>
</svg>
